name: MLCC Quant Research Auto-Run

on:
  schedule:
    - cron: '0 0 * * 1-5'
    - cron: '0 12 * * 5'
  workflow_dispatch:

jobs:
  research-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance requests beautifulsoup4 lxml apscheduler python-dotenv

      - name: Run MLCC Quant Research Pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          DEBUG: '0'
        run: python mlcc_quant_research.py --now

      - name: Upload research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-output
          path: |
            research_data/
            logs/
          retention-days: 30
